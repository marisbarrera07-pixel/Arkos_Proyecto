# Blueprint Render — solo un Web Service gratis (sin base externa).
# Los datos viven en SQLite en memoria/disco efímero y se recrean al reiniciar.

services:
  - type: web
    name: arkos
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_CLIENT
        value: sqlite
      - key: DB_PATH
        value: ":memory:"
      - key: JWT_SECRET
        generateValue: true
